name: Weekly Data Collection

# Runs every Sunday at 04:00 UTC to refresh cloud pricing data and commit
# the results back to main.  A workflow_dispatch trigger lets maintainers
# run a manual refresh at any time without having to push code.
#
# Per-provider failure isolation is handled by the orchestrator itself:
# if a single provider fetch fails, the orchestrator logs the error and
# continues with the remaining providers.  No separate fallback logic is
# needed here.

on:
  # Schedule disabled — data is collected and committed locally then pushed.
  # workflow_dispatch kept for emergency manual runs from the GitHub UI.
  workflow_dispatch:
    inputs:
      providers:
        description: 'Providers to fetch (space-separated, e.g. "aws gcp oci")'
        required: false
        type: string
        default: 'aws azure gcp oci'

permissions:
  contents: write    # needed to git-push the data commit back to main
  id-token: write    # needed for GCP Workload Identity Federation (OIDC)

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # push updated data/ back to main
      id-token: write    # GCP Workload Identity Federation (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Authenticate to GCP via Workload Identity Federation so downstream
      # GCP API calls (and any future GCS/Artifact storage) work without
      # storing a long-lived service-account key as a secret.
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: >-
            projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: >-
            ${{ secrets.GCP_PROJECT_USERNAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run data collection
        # GCP authentication is handled by the WIF step above (ADC).
        # fetch_gcp.py will use ADC automatically when GCP_API_KEY is absent.
        run: |
          PROVIDERS="${{ github.event.inputs.providers || 'aws azure gcp oci' }}"
          echo "Running data collection for providers: $PROVIDERS"
          # shellcheck disable=SC2086
          python scripts/orchestrator.py --providers $PROVIDERS

      - name: Run aggregator
        run: python scripts/aggregate.py

      - name: Sanity-check index.json (soft — logs failure, does not block commit)
        run: |
          python -c "
          import json, sys
          try:
              idx = json.load(open('data/index.json'))
              count = len(idx.get('providers', []))
              print(f'index.json OK: {count} provider(s) present')
              assert count >= 1, 'No providers in index'
          except Exception as e:
              print(f'WARNING: index.json sanity check failed: {e}', file=sys.stderr)
          " || true

      - name: Build site (sanity check)
        run: npm run build

      - name: Commit and push updated data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/
          git diff --cached --quiet \
            || git commit -m "chore: update pricing data [skip ci] - $(date -u '+%Y-%m-%d')"
          git push origin HEAD:main

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Weekly Data Collection"
            echo ""
            if [ -f data/index.json ]; then
              PROVIDER_COUNT=$(python -c "import json; d=json.load(open('data/index.json')); print(len(d.get('providers',[])))" 2>/dev/null || echo "unknown")
              LAST_UPDATED=$(python -c "import json; print(json.load(open('data/index.json')).get('lastUpdated','unknown'))" 2>/dev/null || echo "unknown")
              echo "- **Providers fetched:** ${PROVIDER_COUNT}"
              echo "- **Last updated:** ${LAST_UPDATED}"
            else
              echo "- data/index.json not found — collection may have failed"
            fi
            echo "- **Site:** [cloudpricefinder.com](https://cloudpricefinder.com)"
          } >> "$GITHUB_STEP_SUMMARY"
